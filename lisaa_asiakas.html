<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolOne - Uuden asiakkaan syöttö</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Tuodaan olemassa oleva auth.js, joka hoitaa tarkistukset -->
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide text-blue-400">SolOne <span class="text-slate-300 font-light text-sm">HR & Business</span></h1>
            <div class="flex items-center gap-3">
                <span id="userEmail" class="text-xs text-slate-400"></span>
                <button id="logoutBtn" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded transition cursor-pointer">Kirjaudu ulos</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl w-full mx-auto p-6 my-8">
        <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-xl p-8">
            <h2 class="text-2xl font-semibold mb-2 text-white">Lisää uusi asiakas</h2>
            <p class="text-slate-400 text-sm mb-6">Tämä lomake lähettää tiedot suoraan Make.comin webhookille ja luo asiakkaan sekä tilauksen järjestelmään.</p>

            <form id="customerForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Asiakkaan / Yrityksen nimi *</label>
                    <input type="text" id="nimi" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Sähköposti *</label>
                        <input type="email" id="sahkoposti" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Puhelinnumero</label>
                        <input type="text" id="puhelinnumero" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Osoite</label>
                    <input type="text" id="osoite" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Tilauksen status *</label>
                    <select id="status" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                        <option value="odottaa_maksua" selected>Odottaa maksua</option>
                        <option value="aktiivinen">Aktiivinen</option>
                    </select>
                </div>

                <!-- Palvelupaketti ja Tilaustyyppi -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-slate-700 pt-4 mt-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Palvelupaketti *</label>
                        <select id="palvelu_id" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                            <option value="">Ladataan palveluita...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Tilaustyyppi *</label>
                        <select id="tilaustyyppi" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                            <option value="kuukausi">Kuukausi</option>
                            <option value="vuosi">Vuosi</option>
                            <option value="kerta">Kerta</option>
                            <option value="ikuinen" selected>Ikuinen (Testi/Admin)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Erityishuomiot</label>
                    <textarea id="erityishuomiot" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg transition shadow-lg mt-4 cursor-pointer">
                    Lähetä tiedot järjestelmään
                </button>
            </form>

            <div id="responseMessage" class="hidden mt-6 p-4 rounded-lg text-sm"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-slate-500 text-xs">
        &copy; 2026 SolOne HR & Business. Kaikki oikeudet pidätetään.
    </footer>

    <!-- Logiikka -->
    <script>
        const WEBHOOK_URL = 'https://hook.eu1.make.com/l84equn6syc9jc69ah8p1xesb4txp2ws';

        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('supabase_token');
            const userEmail = localStorage.getItem('user_email');

            // Turvatarkistus: Vain pasi@solone.fi pääsee tälle sivulle[cite: 6]
            if (!token || userEmail !== 'pasi@solone.fi') {
                alert('Ei käyttöoikeutta tälle sivulle.');
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/palvelut?select=id,nimi`, {
                    method: 'GET',
                    headers: {
                        'apikey': ANON_KEY,
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Palveluiden haku epäonnistui');

                const palvelut = await response.json();
                const selectEl = document.getElementById('palvelu_id');

                selectEl.innerHTML = '<option value="">Valitse palvelupaketti...</option>';
                if (palvelut && palvelut.length > 0) {
                    palvelut.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.nimi || `Palvelu (${p.id.substring(0,8)}...)`;
                        selectEl.appendChild(opt);
                    });
                } else {
                    selectEl.innerHTML = '<option value="">Ei palveluita löydy</option>';
                }
            } catch (err) {
                console.error('Virhe palveluiden haussa:', err);
                document.getElementById('palvelu_id').innerHTML = '<option value="">Virhe ladattaessa palveluita</option>';
            }
        });

        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            if (typeof kirjauduUlos === 'function') {
                kirjauduUlos();
            } else {
                localStorage.removeItem('supabase_token');
                window.location.href = 'login.html';
            }
        });

        document.getElementById('customerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('responseMessage');
            const selectPalvelu = document.getElementById('palvelu_id');
            
            btn.disabled = true;
            btn.textContent = 'Lähetetään...';
            msgBox.className = 'hidden mt-6 p-4 rounded-lg text-sm';

            const selectedOption = selectPalvelu.options[selectPalvelu.selectedIndex];

            const formData = {
                nimi: document.getElementById('nimi').value,
                sahkoposti: document.getElementById('sahkoposti').value,
                puhelinnumero: document.getElementById('puhelinnumero').value,
                osoite: document.getElementById('osoite').value,
                status: document.getElementById('status').value, // 'odottaa_maksua' tai 'aktiivinen'
                erityishuomiot: document.getElementById('erityishuomiot').value,
                palvelu_id: selectPalvelu.value,
                palvelun_nimi: selectedOption ? selectedOption.text : '', 
                tilaustyyppi: document.getElementById('tilaustyyppi').value
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    msgBox.textContent = 'Tiedot lähetetty onnistuneesti ja tilaus luodaan järjestelmään!';
                    msgBox.className = 'mt-6 p-4 rounded-lg text-sm bg-emerald-900/50 border border-emerald-700 text-emerald-200 block';
                    document.getElementById('customerForm').reset();
                } else {
                    throw new Error('Palvelinvirhe lähetyksessä.');
                }
            } catch (error) {
                msgBox.textContent = 'Virhe lähetyksessä: ' + error.message;
                msgBox.className = 'mt-6 p-4 rounded-lg text-sm bg-rose-900/50 border border-rose-700 text-rose-200 block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Lähetä tiedot järjestelmään';
            }
        });
    </script>
</body>
</html>
